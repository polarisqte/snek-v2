<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>snek v2</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div id="page-wrapper">
      <div id="game-window">
        <span class="game-title">snek v2</span>
        <div id="score-holder">
          <span id="game-score">score: 0</span>
          <span id="game-highscore">highscore: 0</span>
        </div>

        <div id="game-canvas-holder" style="width: 600px; height: 600px">
          <div id="game-canvas-overlay">
            <span id="overlay-title">start the game</span>
            <span id="overlay-subtitle">press space to begin</span>
          </div>
          <canvas id="game-canvas"></canvas>
        </div>
      </div>

      <div id="settings-window">
        <button id="settings-btn" class="btn no-bg">
          &lt; open settings &gt;
        </button>

        <div id="settings-list" style="display: none">
          <div id="settings-lock" style="display: none">
            unavailable during gameplay
          </div>

          <span class="settings-title">settings</span>
          <span class="settings-subtitle">// size</span>
          <div class="settings-entry">
            <div class="settings-entry-title">grid size</div>
            <div id="grid-size" class="settings-btn-multiple-choice">
              <button
                class="settings-btn-multiple-choice-btn left"
                data-value="small"
              >
                small
              </button>
              <button
                class="settings-btn-multiple-choice-btn"
                data-value="medium"
              >
                medium
              </button>
              <button
                class="settings-btn-multiple-choice-btn right"
                data-value="large"
              >
                large
              </button>
            </div>
          </div>

          <div class="settings-entry">
            <div class="settings-entry-title">canvas size</div>
            <div id="canvas-size" class="settings-btn-multiple-choice">
              <button
                class="settings-btn-multiple-choice-btn left"
                data-value="small"
              >
                small
              </button>
              <button
                class="settings-btn-multiple-choice-btn"
                data-value="medium"
              >
                medium
              </button>
              <button
                class="settings-btn-multiple-choice-btn right"
                data-value="large"
              >
                large
              </button>
            </div>
          </div>

          <span class="settings-subtitle">// food</span>

          <div class="settings-entry">
            <div class="settings-entry-title">food count</div>
            <div id="food-count" class="settings-btn-multiple-choice">
              <button
                class="settings-btn-multiple-choice-btn left"
                data-value="one"
              >
                one
              </button>
              <button
                class="settings-btn-multiple-choice-btn"
                data-value="three"
              >
                three
              </button>
              <button
                class="settings-btn-multiple-choice-btn right"
                data-value="five"
              >
                five
              </button>
            </div>
          </div>

          <span class="settings-subtitle">// game</span>

          <div class="settings-entry">
            <div class="settings-entry-title">game speed</div>
            <div id="game-speed" class="settings-btn-multiple-choice">
              <button
                class="settings-btn-multiple-choice-btn left"
                data-value="slow"
              >
                slow
              </button>
              <button
                class="settings-btn-multiple-choice-btn"
                data-value="default"
              >
                default
              </button>
              <button
                class="settings-btn-multiple-choice-btn right"
                data-value="fast"
              >
                fast
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="settings.js"></script>
    <script src="script.js"></script>
  </body>
</html>
