<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>snek v2</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div id="page-wrapper">
      <div id="game-window">
        <span class="game-title">snek v2</span>
        <div id="score-holder">
          <span id="game-score">score: 0</span>
          <span id="game-highscore">highscore: 0</span>
        </div>

        <div id="game-canvas-holder" style="width: 600px; height: 600px">
          <div id="game-canvas-overlay">
            <span id="overlay-title">start the game</span>
            <span id="overlay-subtitle">press space to begin</span>
          </div>
          <canvas id="game-canvas"></canvas>
        </div>
      </div>

      <div id="settings-window"></div>
    </div>

    <script src="settings.js"></script>
    <script src="script.js"></script>
  </body>
</html>
